# layer-kubevirt-operator — the KubeVirt + CDI platform install.
#
# Applies the pinned KubeVirt operator + CR (virt-operator / virt-api /
# virt-controller / virt-handler) and the CDI operator + CR
# (containerized-data-importer, for DataVolume imports) to a Kubernetes cluster,
# then waits for the KubeVirt CR to report Deployed.
#
# VENUE: the applies run IN-VENUE, exactly like candy/layer-helm-chart's install —
# against the venue's OWN kubeconfig (`/etc/rancher/k3s/k3s.yaml` for a k3s-server
# guest). This is the correct binding for the k3s-VM R10 beds: the cluster is a
# k3s-server guest whose kubeconfig is reachable IN THE GUEST, and a `kube:` verb is
# HOST-side (it would need the host to carry the merged, port-forwarded kubeconfig,
# which a composed candy cannot name without coupling to a bed's profile). Running
# in-venue means the candy works composed into ANY k3s-server venue with no profile
# coupling — the same reason helm-chart does it. The host-side `kubevirt:` readiness
# probe lives in the BED's own plan (which CAN name its own per-deploy
# `kind: kubernetes` profile), never here.
#
# VENUE TOOLING (R9): the in-venue steps shell the venue's OWN Kubernetes client
# (`/usr/local/bin/kubectl` — the k3s-server guest's bundled kubectl, exactly what
# candy/layer-helm-chart uses) and `curl` (base). This candy does NOT install a
# cluster or a client: it operates on the venue's EXISTING cluster, so both are
# provided by the venue (k3s-server / the base image), not declared as install deps.
# The consuming bed composes k3s-server, which provides kubectl.
#
# Standalone repo (the candy de-submodule cutover, kind-prefixed naming).
version: 2026.261.1747
kubevirt-operator:
    candy:
        version: 2026.269.0100
        description: |
            KubeVirt + CDI operator install on a Kubernetes cluster, IN-VENUE.
            Downloads the pinned kubevirt-operator.yaml + kubevirt-cr.yaml and the
            cdi-operator.yaml + cdi-cr.yaml release manifests into the venue, then
            applies them with the venue's OWN kubectl against its OWN kubeconfig
            (KUBECONFIG=/etc/rancher/k3s/k3s.yaml for a k3s-server guest) and waits
            for the KubeVirt CR to report Deployed. KubeVirt turns a Kubernetes
            cluster into a virtualization platform (VirtualMachine /
            VirtualMachineInstance CRDs, virt-launcher pods); CDI adds DataVolumes
            for importing VM disk images. The applies run in-venue (the helm-chart
            precedent) so the candy composes into any k3s-server venue with no
            host-side cluster-profile coupling; the host-side `kubevirt:` readiness
            probe is the bed's own plan step.
        var:
            KUBEVIRT_VERSION: v1.9.0
            CDI_VERSION: v1.66.1
            # KUBECONFIG_IN_VENUE is the venue's own kubeconfig. A k3s-server guest
            # carries /etc/rancher/k3s/k3s.yaml; a host-installed cluster may point
            # elsewhere via the composed deploy's env:. Default matches k3s.
            KUBECONFIG_IN_VENUE: /etc/rancher/k3s/k3s.yaml
        plan:
            - run: wait for the k3s API server AND a Ready node IN-VENUE before any apply (the kubeconfig lands when k3s's apiserver starts, and the node registers moments later — the k3s-kernel candy may also reboot the guest; poll bounded, the helm-chart precedent, never a one-shot wait that errors on an empty node list)
              id: kubevirt-apiserver-ready
              command: |
                  set -euo pipefail
                  export KUBECONFIG="${KUBECONFIG_IN_VENUE}"
                  deadline=$(( $(date +%s) + 420 ))
                  until [ -s "${KUBECONFIG_IN_VENUE}" ] \
                        && /usr/local/bin/kubectl get --raw /readyz >/dev/null 2>&1 \
                        && [ "$(/usr/local/bin/kubectl get nodes --no-headers 2>/dev/null | grep -c ' Ready ')" -ge 1 ]; do
                    if [ "$(date +%s)" -ge "$deadline" ]; then
                      echo "k3s apiserver/node did not become ready within 420s" >&2
                      /usr/local/bin/kubectl get nodes -o wide 2>&1 || true
                      exit 1
                    fi
                    sleep 2
                  done
              run_as: root
              context: [deploy]
            - run: download the pinned KubeVirt operator + CR manifests into the venue
              id: kubevirt-manifests-fetch
              command: |
                  set -euo pipefail
                  mkdir -p /var/lib/charly
                  base="https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}"
                  for f in kubevirt-operator.yaml kubevirt-cr.yaml; do
                    [ -s "/var/lib/charly/$f" ] || curl -fsSL -o "/var/lib/charly/$f" "$base/$f"
                  done
              run_as: root
              context: [deploy]
            - run: download the pinned CDI operator + CR manifests into the venue
              id: cdi-manifests-fetch
              command: |
                  set -euo pipefail
                  mkdir -p /var/lib/charly
                  base="https://github.com/kubevirt/containerized-data-importer/releases/download/${CDI_VERSION}"
                  for f in cdi-operator.yaml cdi-cr.yaml; do
                    [ -s "/var/lib/charly/$f" ] || curl -fsSL -o "/var/lib/charly/$f" "$base/$f"
                  done
              run_as: root
              context: [deploy]
            - run: apply the KubeVirt operator manifest against the venue's own kubeconfig, then wait for the operator rollout
              id: kubevirt-operator-apply
              command: |
                  set -euo pipefail
                  export KUBECONFIG="${KUBECONFIG_IN_VENUE}"
                  /usr/local/bin/kubectl apply -f /var/lib/charly/kubevirt-operator.yaml
                  /usr/local/bin/kubectl -n kubevirt wait --for=condition=Available --timeout=300s deployment/virt-operator
              run_as: root
              context: [deploy]
            - run: apply the KubeVirt CR, then wait for the KubeVirt control plane (the operator reconciles virt-api / virt-controller / virt-handler ASYNCHRONOUSLY after the CR — wait for each to EXIST first, then for its rollout, bounded)
              id: kubevirt-cr-apply
              command: |
                  set -euo pipefail
                  export KUBECONFIG="${KUBECONFIG_IN_VENUE}"
                  /usr/local/bin/kubectl apply -f /var/lib/charly/kubevirt-cr.yaml
                  # KubeVirt v1.9 enables ALL Beta feature gates by default, including
                  # `ImageVolume` (upstream kubevirt#17405). On a cluster without the k8s
                  # ImageVolume feature (k3s < 1.35) ImageVolume's code path execs KubeVirt's
                  # own `/usr/bin/container-disk` helper OUT of the containerDisk image, which
                  # a plain containerDisk does not carry — the virt-launcher then dies with
                  # `stat /container-disk-binary/usr/bin/container-disk: no such file or
                  # directory` and the VM CrashLoops (upstream kubevirt#17460). Disable the
                  # gate so KubeVirt uses the legacy init-container path that copies
                  # `container-disk` from the virt-launcher image. (Also tracked: kubevirt v1.9
                  # officially supports k8s 1.34+; the k3s node version is the longer-term fix.)
                  /usr/local/bin/kubectl patch kubevirt kubevirt -n kubevirt --type merge \
                    -p '{"spec":{"configuration":{"developerConfiguration":{"disabledFeatureGates":["ImageVolume"]}}}}'
                  # The operator creates the control-plane workloads after the CR; wait for
                  # each object to EXIST before waiting on its rollout (a one-shot wait on a
                  # not-yet-created Deployment errors "NotFound").
                  wait_for() { # kind name timeout
                    local kind="$1" name="$2" timeout="$3" deadline
                    deadline=$(( $(date +%s) + timeout ))
                    until /usr/local/bin/kubectl -n kubevirt get "$kind" "$name" >/dev/null 2>&1; do
                      if [ "$(date +%s)" -ge "$deadline" ]; then
                        echo "kubevirt $kind/$name did not appear within ${timeout}s" >&2
                        return 1
                      fi
                      sleep 2
                    done
                  }
                  wait_for deployment virt-api 300
                  wait_for deployment virt-controller 300
                  wait_for daemonset virt-handler 420
                  /usr/local/bin/kubectl -n kubevirt wait --for=condition=Available --timeout=600s deployment/virt-api
                  /usr/local/bin/kubectl -n kubevirt wait --for=condition=Available --timeout=600s deployment/virt-controller
                  /usr/local/bin/kubectl -n kubevirt rollout status --timeout=600s daemonset/virt-handler
              run_as: root
              context: [deploy]
            - run: apply the CDI operator manifest (DataVolumes for VM image import)
              id: cdi-operator-apply
              command: |
                  set -euo pipefail
                  export KUBECONFIG="${KUBECONFIG_IN_VENUE}"
                  /usr/local/bin/kubectl apply -f /var/lib/charly/cdi-operator.yaml
                  /usr/local/bin/kubectl -n cdi wait --for=condition=Available --timeout=300s deployment/cdi-operator
              run_as: root
              context: [deploy]
            - run: apply the CDI CR, then wait for the CDI control plane (the operator reconciles cdi-apiserver asynchronously — wait for EXISTENCE, then rollout, bounded)
              id: cdi-cr-apply
              command: |
                  set -euo pipefail
                  export KUBECONFIG="${KUBECONFIG_IN_VENUE}"
                  /usr/local/bin/kubectl apply -f /var/lib/charly/cdi-cr.yaml
                  deadline=$(( $(date +%s) + 600 ))
                  until /usr/local/bin/kubectl -n cdi get deployment cdi-apiserver >/dev/null 2>&1; do
                    if [ "$(date +%s)" -ge "$deadline" ]; then
                      echo "cdi deployment/cdi-apiserver did not appear within 600s" >&2
                      exit 1
                    fi
                    sleep 2
                  done
                  /usr/local/bin/kubectl -n cdi wait --for=condition=Available --timeout=600s deployment/cdi-apiserver
              run_as: root
              context: [deploy]
            # ADE: the candy that installs the platform also asserts it is present
            # in the venue's cluster (R3 — the host-side `kubevirt:` readiness probe
            # is the bed's own plan step, which can name its per-deploy profile).
            - check: the KubeVirt CRD is registered and the KubeVirt control-plane pods are running in the venue
              id: kubevirt-installed
              command: |
                  set -euo pipefail
                  export KUBECONFIG="${KUBECONFIG_IN_VENUE}"
                  /usr/local/bin/kubectl get crd virtualmachines.kubevirt.io >/dev/null
                  /usr/local/bin/kubectl -n kubevirt get pods --no-headers | grep -q virt-api
              run_as: root
              context: [runtime]
